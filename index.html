<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Printer Simulator - Live Wallpaper</title>
  <link rel="stylesheet" href="style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <canvas id="canvas3d"></canvas>

  <!-- Botón discreto para mostrar/ocultar el panel -->
  <button id="toggleUiBtn" title="Mostrar/Ocultar configuración">⚙️</button>

  <!-- UI flotante -->
  <div id="ui-container">
    <div class="panel">
      <div class="panel-header">
        <h3>Simulador Impresión 3D</h3>
        <button id="closeUiBtn" title="Ocultar panel">✕</button>
      </div>

      <label class="file-btn">
        📂 Cargar archivo .STL
        <input type="file" id="stlInput" accept=".stl" hidden />
      </label>

      <div class="control-group">
        <label for="filamentColor">Filamento</label>
        <input type="color" id="filamentColor" value="#00a8ff" />
      </div>

      <div class="control-group">
        <label for="printerColor">Chasis Impresora</label>
        <input type="color" id="printerColor" value="#242730" />
      </div>

      <div class="control-group">
        <label for="chassisOpacitySlider">Opacidad Chasis: <span id="chassisOpacityVal">100%</span></label>
        <input type="range" id="chassisOpacitySlider" min="0.1" max="1.0" step="0.05" value="1.0" />
      </div>

      <div class="control-group">
        <label for="bgColor">Fondo</label>
        <input type="color" id="bgColor" value="#0d0f14" />
      </div>

      <div class="control-group">
        <label for="speedSlider">Velocidad: <span id="speedVal">1.0x</span></label>
        <input type="range" id="speedSlider" min="0.2" max="5.0" step="0.2" value="1.0" />
      </div>

      <div class="control-group">
        <label for="autoRotateToggle">Rotación Cámara</label>
        <input type="checkbox" id="autoRotateToggle" checked />
      </div>

      <div class="control-group" id="rotateSpeedGroup">
        <label for="rotateSpeedSlider">Vel. Rotación: <span id="rotateSpeedVal">0.6</span></label>
        <input type="range" id="rotateSpeedSlider" min="0.1" max="3.0" step="0.1" value="0.6" />
      </div>

      <div class="status-bar">
        <span id="layerInfo">Capa: 0 / 0</span>
        <span id="progressInfo">0%</span>
      </div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
