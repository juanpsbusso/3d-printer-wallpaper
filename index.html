<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Printer Simulator - Live Wallpaper</title>
  <link rel="stylesheet" href="style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
        "fflate": "https://cdn.jsdelivr.net/npm/fflate@0.8.2/esm/browser.js"
      }
    }
  </script>
</head>
<body>
  <canvas id="canvas3d"></canvas>

  <!-- Single minimal settings gear button -->
  <button id="toggleUiBtn" class="gear-btn" title="Settings, Model & Camera">⚙️</button>

  <!-- Unified Panel -->
  <div id="ui-container" class="collapsed">
    <div class="panel">
      <div class="panel-header">
        <h3>3D Printer Simulator</h3>
        <button id="closeUiBtn" title="Close">✕</button>
      </div>

      <!-- Quick Action Bar inside menu -->
      <div class="quick-bar">
        <button id="playPauseBtn" title="Play / Pause">⏸️ Pause</button>
        <button id="nightModeBtn" title="Toggle Night Mode">🌙 Night</button>
        <button id="lockCameraBtn" title="Lock / Unlock Camera">🔓 Free</button>
      </div>

      <!-- Tabs: Settings / Model / Camera -->
      <div class="tabs">
        <button class="tab-btn active" data-tab="tab-settings">Print</button>
        <button class="tab-btn" data-tab="tab-model">Model</button>
        <button class="tab-btn" data-tab="tab-camera">Camera</button>
      </div>

      <!-- TAB 1: PRINT & VISUAL SETTINGS -->
      <div id="tab-settings" class="tab-content active">
        <label class="file-btn">
          📂 Load .STL / .3MF File
          <input type="file" id="modelInput" accept=".stl,.3mf" hidden />
        </label>

        <div class="control-group" id="filamentColorGroup">
          <label for="filamentColor">Filament Color <span id="multicolorBadge" class="badge-3mf" style="display:none;">3MF</span></label>
          <input type="color" id="filamentColor" value="#00a8ff" />
        </div>

        <div class="control-group" id="use3mfColorsGroup" style="display:none;">
          <label for="use3mfColorsToggle">Use .3MF Embedded Colors</label>
          <input type="checkbox" id="use3mfColorsToggle" checked />
        </div>

        <div class="control-group">
          <label for="infillToggle">Print Infill</label>
          <input type="checkbox" id="infillToggle" checked />
        </div>

        <div class="control-group" id="infillDensityGroup">
          <label for="infillSlider">Infill Density: <span id="infillVal">20%</span></label>
          <input type="range" id="infillSlider" min="10" max="60" step="10" value="20" />
        </div>

        <div class="control-group">
          <label for="printerColor">Frame Color</label>
          <input type="color" id="printerColor" value="#242730" />
        </div>

        <div class="control-group">
          <label for="chassisOpacitySlider">Frame Opacity: <span id="chassisOpacityVal">35%</span></label>
          <input type="range" id="chassisOpacitySlider" min="0" max="1.0" step="0.05" value="0.35" />
        </div>

        <div class="control-group">
          <label for="bgColor">Background</label>
          <input type="color" id="bgColor" value="#0d0f14" />
        </div>

        <div class="control-group">
          <label for="speedSlider">Print Speed: <span id="speedVal">1.0x</span></label>
          <input type="range" id="speedSlider" min="0" max="5.0" step="0.1" value="1.0" />
        </div>

        <div class="control-group">
          <label for="nightModeToggle">Night Mode</label>
          <input type="checkbox" id="nightModeToggle" />
        </div>

        <div class="control-group">
          <label for="reverseLoopToggle">Reverse Loop</label>
          <input type="checkbox" id="reverseLoopToggle" checked />
        </div>
      </div>

      <!-- TAB 2: MODEL TRANSFORM (SCALE & ROTATION) -->
      <div id="tab-model" class="tab-content">
        <div class="control-group">
          <label for="modelScaleSlider">Model Scale: <span id="modelScaleVal">100%</span></label>
          <input type="range" id="modelScaleSlider" min="30" max="140" step="5" value="100" />
        </div>

        <div class="control-group">
          <label for="rotXSlider">Rotate X: <span id="rotXVal">0°</span></label>
          <input type="range" id="rotXSlider" min="-180" max="180" step="15" value="0" />
        </div>

        <div class="control-group">
          <label for="rotYSlider">Rotate Y (Spin): <span id="rotYVal">0°</span></label>
          <input type="range" id="rotYSlider" min="-180" max="180" step="15" value="0" />
        </div>

        <div class="control-group">
          <label for="rotZSlider">Rotate Z: <span id="rotZVal">0°</span></label>
          <input type="range" id="rotZSlider" min="-180" max="180" step="15" value="0" />
        </div>

        <div class="pad-presets" style="margin-top: 8px;">
          <button id="rotX90Btn" title="Rotate +90° on X">↻ X +90°</button>
          <button id="rotZ90Btn" title="Rotate +90° on Z">↻ Z +90°</button>
          <button id="resetTransformBtn" title="Reset Scale & Rotation">⟲ Reset</button>
        </div>

        <p class="helper-hint">Adjust orientation so the model sits flat on the build plate.</p>
      </div>

      <!-- TAB 3: CAMERA -->
      <div id="tab-camera" class="tab-content">
        <div id="camera-controls-wrapper">
          <div class="joysticks-row">
            <div class="joy-wrapper">
              <span class="pad-label">Orbit</span>
              <div class="joystick-base" id="joyOrbit">
                <div class="joystick-stick" id="stickOrbit"></div>
              </div>
            </div>

            <div class="joy-wrapper">
              <span class="pad-label">Pan</span>
              <div class="joystick-base" id="joyPan">
                <div class="joystick-stick" id="stickPan"></div>
              </div>
            </div>
          </div>

          <div class="pad-zoom">
            <button id="zoomInBtn">➕ Zoom In</button>
            <button id="zoomOutBtn">➖ Zoom Out</button>
          </div>

          <div class="pad-presets">
            <button data-cam="view-front">Front</button>
            <button data-cam="view-iso">3D</button>
            <button data-cam="view-top">Top</button>
          </div>
        </div>

        <div class="control-group" style="margin-top: 12px;">
          <label for="lockCameraToggle">Lock Camera</label>
          <input type="checkbox" id="lockCameraToggle" />
        </div>

        <div class="control-group" id="autoRotateGroup">
          <label for="autoRotateToggle">Auto Rotate</label>
          <input type="checkbox" id="autoRotateToggle" checked />
        </div>

        <div class="control-group" id="rotateSpeedGroup">
          <label for="rotateSpeedSlider">Rotate Speed: <span id="rotateSpeedVal">0.5</span></label>
          <input type="range" id="rotateSpeedSlider" min="0.1" max="3.0" step="0.1" value="0.5" />
        </div>
      </div>

      <div class="status-bar">
        <span id="layerInfo">Layer: 0 / 0</span>
        <span id="progressInfo">0%</span>
      </div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
