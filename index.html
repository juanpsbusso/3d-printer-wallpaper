<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Printer Simulator - Live Wallpaper</title>
  <link rel="stylesheet" href="style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <canvas id="canvas3d"></canvas>

  <!-- Botones flotantes minimalistas -->
  <div id="quick-actions">
    <button id="lockCameraBtn" class="icon-btn" title="Bloquear / Desbloquear cámara">🔓</button>
    <button id="toggleCameraPadBtn" class="icon-btn" title="Joysticks de cámara">🕹️</button>
    <button id="toggleUiBtn" class="icon-btn" title="Configuración">⚙️</button>
  </div>

  <!-- Panel de Joysticks de Cámara (arriba a la derecha, debajo de botones, lejos de barra de tareas) -->
  <div id="camera-pad" class="collapsed">
    <div class="pad-header">
      <span>Control Analógico Cámara</span>
      <button id="closeCameraPadBtn" title="Cerrar">✕</button>
    </div>

    <div class="joysticks-row">
      <div class="joy-wrapper">
        <span class="pad-label">Rotar</span>
        <div class="joystick-base" id="joyOrbit">
          <div class="joystick-stick" id="stickOrbit"></div>
        </div>
      </div>

      <div class="joy-wrapper">
        <span class="pad-label">Mover (Pan)</span>
        <div class="joystick-base" id="joyPan">
          <div class="joystick-stick" id="stickPan"></div>
        </div>
      </div>
    </div>

    <div class="pad-zoom">
      <button id="zoomInBtn">➕ Acercar</button>
      <button id="zoomOutBtn">➖ Alejar</button>
    </div>

    <div class="pad-presets">
      <button data-cam="view-front">Frente</button>
      <button data-cam="view-iso">3D</button>
      <button data-cam="view-top">Arriba</button>
    </div>
  </div>

  <!-- Panel principal de configuración -->
  <div id="ui-container" class="collapsed">
    <div class="panel">
      <div class="panel-header">
        <h3>Simulador Impresión 3D</h3>
        <button id="closeUiBtn" title="Ocultar panel">✕</button>
      </div>

      <label class="file-btn">
        📂 Cargar archivo .STL
        <input type="file" id="stlInput" accept=".stl" hidden />
      </label>

      <div class="control-group">
        <label for="filamentColor">Filamento</label>
        <input type="color" id="filamentColor" value="#00a8ff" />
      </div>

      <div class="control-group">
        <label for="infillSlider">Relleno (Infill): <span id="infillVal">20%</span></label>
        <input type="range" id="infillSlider" min="0" max="60" step="10" value="20" />
      </div>

      <div class="control-group">
        <label for="printerColor">Chasis Impresora</label>
        <input type="color" id="printerColor" value="#242730" />
      </div>

      <div class="control-group">
        <label for="chassisOpacitySlider">Opacidad Chasis: <span id="chassisOpacityVal">35%</span></label>
        <input type="range" id="chassisOpacitySlider" min="0.05" max="1.0" step="0.05" value="0.35" />
      </div>

      <div class="control-group">
        <label for="bgColor">Fondo</label>
        <input type="color" id="bgColor" value="#0d0f14" />
      </div>

      <div class="control-group">
        <label for="speedSlider">Velocidad: <span id="speedVal">1.0x</span></label>
        <input type="range" id="speedSlider" min="0.2" max="5.0" step="0.2" value="1.0" />
      </div>

      <div class="control-group">
        <label for="lockCameraToggle">Bloquear Cámara</label>
        <input type="checkbox" id="lockCameraToggle" />
      </div>

      <div class="control-group" id="autoRotateGroup">
        <label for="autoRotateToggle">Rotación Cámara</label>
        <input type="checkbox" id="autoRotateToggle" checked />
      </div>

      <div class="control-group" id="rotateSpeedGroup">
        <label for="rotateSpeedSlider">Vel. Rotación: <span id="rotateSpeedVal">0.5</span></label>
        <input type="range" id="rotateSpeedSlider" min="0.1" max="3.0" step="0.1" value="0.5" />
      </div>

      <div class="status-bar">
        <span id="layerInfo">Capa: 0 / 0</span>
        <span id="progressInfo">0%</span>
      </div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
